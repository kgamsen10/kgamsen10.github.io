<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Portfolio</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1 class="h1">
            Contact Me
        </h1>
     <section id="contact" class="contact-section">

    <div class="contact-content">

        <h2 class="p5">Let's Work Together</h2>

        <p class="p1">
            Have a project in mind? Send me a message and let's talk.
        </p>

        <form 
            action="https://formspree.io/f/YOUR_FORM_ID" 
            method="POST"
            class="contact-form"
        >

            <label for="name" class="p6">Name</label>
            <input 
                type="text"
                id="name"
                name="name"
                placeholder="Your Name"
                required
            >

            <label for="email"class="p6">Email</label>
            <input 
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label for="message" class="p6">Message</label>
            <textarea
                id="message"
                name="message"
                placeholder="Tell me about your project..."
                rows="6"
                required
            ></textarea>

            <button type="submit" class="btn">
                Send Message
            </button>

        </form>

    </div>

</section>
